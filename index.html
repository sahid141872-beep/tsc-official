<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIMCHORY SPORTS CLUB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 20px;
        }

        .backup-section {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .backup-section p {
            font-size: 0.9rem;
            color: #2e7d32;
            width: 100%;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #1b5e20;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid #2e7d32;
            color: #2e7d32;
        }

        .btn-outline:hover {
            background-color: #2e7d32;
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        .data-list {
            margin-top: 25px;
        }

        .data-item {
            background: #f9f9f9;
            padding: 12px;
            border-left: 4px solid #2e7d32;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>THIMCHORY SPORTS CLUB</h1>

    <!-- ডাটা ব্যাকআপ ও রিস্টোর সেকশন -->
    <div class="backup-section">
        <p>🛡️ ডাটা সুরক্ষা টুল (কোড আপডেট করার আগে বা পরে ব্যবহার করুন):</p>
        <button class="btn" onclick="exportDataBackup()">📥 ব্যাকআপ ডাউনলোড করুন</button>
        
        <label for="importFile" class="btn btn-outline">📤 ব্যাকআপ আপলোড করুন</label>
        <input type="file" id="importFile" class="file-input" accept=".json" onchange="importDataBackup(event)">
    </div>

    <!-- প্লেয়ার যুক্ত করার ফর্ম -->
    <div class="form-group">
        <label for="playerName">প্লেয়ারের নাম লিখুন:</label>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="playerName" placeholder="উদাহরণ: রহিম আহমেদ">
            <button class="btn" onclick="addPlayer()">যুক্ত করুন</button>
        </div>
    </div>

    <!-- প্লেয়ারদের তালিকা -->
    <div class="data-list">
        <h3>ক্লাব সদস্য ও প্লেয়ার তালিকা:</h3>
        <div id="playerList" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    // ১. ডাটা কি (Key) নাম স্থায়ী রাখা (যা কখনো পরিবর্তন হবে না)
    const STORAGE_KEY = 'tsc_official_club_data_v1';

    // ২. ডাটা সেভ করার নিরাপদ ফাংশন
    function saveClubData(data) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
            console.error('ডাটা সেভ করতে ব্যর্থ:', e);
        }
    }

    // ৩. ডাটা লোড করার ফাংশন
    function loadClubData() {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (!savedData) {
            return { players: [] };
        }
        try {
            return JSON.parse(savedData);
        } catch (e) {
            console.error('ডাটা লোড করতে সমস্যা হয়েছে:', e);
            return { players: [] };
        }
    }

    // ৪. স্ক্রিনে প্লেয়ার তালিকা দেখানো
    function renderPlayers() {
        const data = loadClubData();
        const listElement = document.getElementById('playerList');
        listElement.innerHTML = '';

        if (data.players.length === 0) {
            listElement.innerHTML = '<p style="color: #777;">এখনো কোনো নাম যুক্ত করা হয়নি।</p>';
            return;
        }

        data.players.forEach((player, index) => {
            const item = document.createElement('div');
            item.className = 'data-item';
            item.innerHTML = `
                <span><strong>${index + 1}.</strong> ${player}</span>
                <button style="background:#d32f2f; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="deletePlayer(${index})">মুছুন</button>
            `;
            listElement.appendChild(item);
        });
    }

    // ৫. নতুন প্লেয়ার যোগ করা
    function addPlayer() {
        const input = document.getElementById('playerName');
        const name = input.value.trim();

        if (name === '') {
            alert('অনুগ্রহ করে একটি নাম লিখুন!');
            return;
        }

        const data = loadClubData();
        data.players.push(name);
        saveClubData(data);
        input.value = '';
        renderPlayers();
    }

    // ৬. প্লেয়ার ডিলিট করা
    function deletePlayer(index) {
        const data = loadClubData();
        data.players.splice(index, 1);
        saveClubData(data);
        renderPlayers();
    }

    // ৭. ব্যাকআপ ফাইল ডাউনলোড (Export)
    function exportDataBackup() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data || JSON.parse(data).players.length === 0) {
            return alert('ডাউনলোড করার মতো কোনো ডাটা পাওয়া যায়নি!');
        }
        
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TSC_Club_Data_Backup.json`;
        a.click();
    }

    // ৮. ব্যাকআপ ফাইল থেকে ডাটা রিস্টোর (Import)
    function importDataBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data && Array.isArray(data.players)) {
                    saveClubData(data);
                    alert('ডাটা সফলভাবে রিস্টোর হয়েছে!');
                    renderPlayers();
                } else {
                    alert('সঠিক ব্যাকআপ ফাইল নির্বাচন করুন!');
                }
            } catch (err) {
                alert('ফাইলটি পড়া যাচ্ছে না!');
            }
        };
        reader.readAsText(file);
    }

    // পেজ লোড হলে ডাটা দেখাবে
    window.onload = renderPlayers;
</script>

</body>
</html>
